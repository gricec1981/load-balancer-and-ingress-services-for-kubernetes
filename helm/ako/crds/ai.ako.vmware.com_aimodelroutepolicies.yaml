---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: aimodelroutepolicies.ai.ako.vmware.com
spec:
  group: ai.ako.vmware.com
  names:
    kind: AIModelRoutePolicy
    listKind: AIModelRoutePolicyList
    plural: aimodelroutepolicies
    singular: aimodelroutepolicy
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        description: |-
          AIModelRoutePolicy routes inference requests to different backends based on
          the requested model, organised into quality/cost tiers. The requested model
          is read from the request body (modelField) by an SE DataScript, mapped to a
          tier, optionally gated by the caller's verified group claim, and the request
          is routed to that tier's backend Pool Group via avi.poolgroup.select().

          Tier access can reuse the verified group claim produced by AIGatewayAuthPolicy
          on the same route. A caller requesting a tier they are not entitled to is
          either downgraded to their best allowed tier or rejected (onUnentitled).
        type: object
        required:
        - spec
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            description: Spec defines the desired model-routing configuration.
            type: object
            required:
            - targetRef
            - tiers
            - modelTiers
            - defaultTier
            properties:
              targetRef:
                description: |-
                  targetRef identifies the HTTPRoute (or Gateway) this policy applies to.
                type: object
                required:
                - group
                - kind
                - name
                properties:
                  group:
                    type: string
                  kind:
                    type: string
                    enum:
                    - HTTPRoute
                    - Gateway
                  name:
                    type: string
              modelField:
                description: |-
                  modelField is the JSON body key the DataScript reads to determine the
                  requested model. OpenAI-compatible APIs use "model".
                type: string
                default: model
              tiers:
                description: |-
                  tiers lists the routing destinations, ordered most-preferred first.
                  Each tier maps to one backend (an InferencePool to retain per-pod
                  metric-weighted load balancing, or a Service). AKO builds one Avi Pool
                  Group per tier and the DataScript selects it directly.
                type: array
                minItems: 1
                items:
                  type: object
                  required:
                  - name
                  properties:
                    name:
                      description: |-
                        Unique tier identifier. Becomes the ai_tier reqvar value and part
                        of the generated Pool Group name.
                      type: string
                    backendRef:
                      description: |-
                        backendRef is the backend that serves this tier. Typically an
                        InferencePool (group gateway.inference.x-k8s.io); a core Service
                        is also supported. Omit when provider is set.
                      type: object
                      properties:
                        group:
                          type: string
                          default: ""
                        kind:
                          type: string
                          enum:
                          - InferencePool
                          - Service
                        name:
                          type: string
                    provider:
                      description: |-
                        provider routes this tier to an external OpenAI-compatible API
                        (e.g. Gemini) over the Service Engine's egress. AKO authors an FQDN
                        pool with backend TLS/SNI and the model-route DataScript rewrites
                        the path + Host and injects the API key (from a Secret) before
                        forwarding. Mutually exclusive with backendRef.
                      type: object
                      required:
                      - host
                      - path
                      properties:
                        host:
                          description: Provider FQDN, e.g. generativelanguage.googleapis.com. The SE resolves it by DNS.
                          type: string
                        port:
                          type: integer
                          default: 443
                        tls:
                          description: Backend TLS + SNI to host. Default true.
                          type: boolean
                          default: true
                        path:
                          description: Provider chat-completions path the request is rewritten to (e.g. /v1beta/openai/chat/completions).
                          type: string
                        auth:
                          description: Injects the provider API key (from a Secret) as a request header.
                          type: object
                          required:
                          - secretRef
                          properties:
                            secretRef:
                              type: object
                              required:
                              - name
                              properties:
                                name:
                                  type: string
                                key:
                                  description: Secret data key. Defaults to the Secret's single key.
                                  type: string
                            header:
                              description: Header to set. Default Authorization.
                              type: string
                              default: Authorization
                            scheme:
                              description: Value prefix. Default "Bearer". Set "" for a raw key.
                              type: string
                              default: Bearer
                    remote:
                      description: |-
                        remote routes this tier to a peer AI Gateway at another site,
                        reached by its FQDN over the Service Engine's egress. AKO authors
                        an FQDN pool — the SE resolves and re-resolves the name itself —
                        so the peer's VIP may change with no EndpointSlice to maintain and
                        no credentials for the peer's cluster. Unlike provider the peer is
                        not a vendor: the request is forwarded unchanged apart from the
                        Host header, and its response is metered normally.
                        Mutually exclusive with backendRef and provider.
                      type: object
                      required:
                      - host
                      properties:
                        host:
                          description: |-
                            Peer gateway FQDN, e.g. llm.siteb.ai.avi.com. Must resolve on a DNS
                            server the Service Engines query, and should resolve to a single
                            address — every A record returned becomes a pool server.
                          type: string
                        port:
                          type: integer
                          default: 443
                        tls:
                          description: Backend TLS to the peer. SNI is host. Default true.
                          type: boolean
                          default: true
                        preserveHost:
                          description: |-
                            Keep the client's Host header instead of rewriting it to host. Set
                            only when the peer serves the same FQDN as this gateway; by default
                            the Host is rewritten so the peer's EVH child VS matches.
                          type: boolean
                          default: false
                        healthPath:
                          description: |-
                            Path a health monitor requests to decide whether the peer is up.
                            Set "-" for no monitor, in which case the pool counts as up whenever
                            the name resolves and failing over to another tier is meaningless.
                          type: string
                          default: /v1/models
              modelTiers:
                description: |-
                  modelTiers maps a requested model name to a tier name. Keys may be an
                  exact model name or a single trailing "*" prefix glob (e.g. "mistral-7b*").
                  The longest matching prefix wins. A model not matched here uses defaultTier.
                  Example: {"llama-3-70b-instruct": "premium", "mistral-7b*": "standard"}
                type: object
                additionalProperties:
                  type: string
              defaultTier:
                description: |-
                  defaultTier is the tier used for any requested model not matched by
                  modelTiers. Must be the name of one of the tiers above.
                type: string
              entitlements:
                description: |-
                  entitlements restricts which auth groups may reach which tiers. Requires
                  an AIGatewayAuthPolicy on the same route so the group claim is verified
                  and readable by the DataScript. When omitted, routing is by model only.
                type: object
                properties:
                  groupClaim:
                    description: |-
                      groupClaim names the verified JWT claim (or forwarded header) that
                      carries the caller's group.
                    type: string
                    default: group
                  rules:
                    description: |-
                      rules lists, per group, the tiers that group is allowed to reach.
                      A group not listed is treated as entitled to no tier (subject to
                      onUnentitled).
                    type: array
                    items:
                      type: object
                      required:
                      - group
                      - allow
                      properties:
                        group:
                          description: The group claim value this rule applies to.
                          type: string
                        allow:
                          description: Tier names this group may be routed to.
                          type: array
                          items:
                            type: string
              onUnentitled:
                description: |-
                  onUnentitled controls behaviour when a caller requests (or defaults to)
                  a tier they are not entitled to, or when the requested model is unknown
                  and the default tier is not allowed.
                type: object
                properties:
                  type:
                    description: |-
                      "Downgrade" routes the request to the highest tier the caller IS
                      entitled to (rejecting only if none). "Reject" returns statusCode.
                    type: string
                    default: Downgrade
                    enum:
                    - Downgrade
                    - Reject
                  statusCode:
                    description: HTTP status returned when type is Reject (or downgrade finds no allowed tier).
                    type: integer
                    default: 403
                    minimum: 400
                    maximum: 599
              discovery:
                description: |-
                  discovery, when enabled, extends modelTiers with aliases discovered
                  from running pods: any pod in an allowed namespace carrying the alias
                  annotation and a tier label naming a declared tier is merged into the
                  model-to-tier table at translation time. Static modelTiers entries win
                  over discovered ones; pods claiming an undeclared tier or a duplicate
                  alias are ignored with a warning. Deleting the pods un-registers the
                  alias (requests fall back to defaultTier).
                type: object
                required:
                - enabled
                properties:
                  enabled:
                    description: Turns pod-based model alias discovery on.
                    type: boolean
                  aliasAnnotation:
                    description: Pod annotation carrying the model alias to publish.
                    type: string
                    default: ai.ako.vmware.com/model-alias
                  tierLabel:
                    description: Pod label carrying the tier name; must name a declared tier.
                    type: string
                    default: ai.ako.vmware.com/tier
                  namespaces:
                    description: |-
                      Namespaces whose pods may register aliases (the governance gate).
                      Defaults to the policy's own namespace.
                    type: array
                    items:
                      type: string
          status:
            description: Status reflects the observed state of the policy.
            type: object
            properties:
              conditions:
                type: array
                items:
                  type: object
                  properties:
                    type:
                      type: string
                    status:
                      type: string
                    reason:
                      type: string
                    message:
                      type: string
                    lastTransitionTime:
                      type: string
                      format: date-time
    additionalPrinterColumns:
    - name: Target
      type: string
      jsonPath: .spec.targetRef.name
    - name: DefaultTier
      type: string
      jsonPath: .spec.defaultTier
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
