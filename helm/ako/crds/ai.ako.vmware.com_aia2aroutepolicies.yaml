---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: aia2aroutepolicies.ai.ako.vmware.com
spec:
  group: ai.ako.vmware.com
  names:
    kind: AIA2ARoutePolicy
    listKind: AIA2ARoutePolicyList
    plural: aia2aroutepolicies
    singular: aia2aroutepolicy
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        description: |-
          AIA2ARoutePolicy governs Agent-to-Agent (A2A) protocol traffic on an HTTPRoute.
          It enforces agent identity (via a shared AIGatewayAuthPolicy), pins multi-turn A2A
          tasks to the same backend instance (taskAffinity), and restricts which calling agents
          may invoke which A2A methods (agentAccess). Three traffic shapes are handled:
          agent card discovery (GET /.well-known/agent.json), task submission (tasks/send,
          tasks/sendSubscribe), and task follow-ups (tasks/get, tasks/cancel, tasks/resubscribe).
        type: object
        required:
        - spec
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            description: Spec defines the desired A2A-route configuration.
            type: object
            required:
            - targetRef
            properties:
              targetRef:
                description: targetRef identifies the A2A HTTPRoute this policy applies to.
                type: object
                required:
                - group
                - kind
                - name
                properties:
                  group:
                    type: string
                  kind:
                    type: string
                    enum:
                    - HTTPRoute
                    - Gateway
                  name:
                    type: string
              authRef:
                description: |-
                  authRef references an AIGatewayAuthPolicy in the same namespace whose
                  identity provider this A2A route shares. AKO reuses that policy's issuer
                  Pool and OAuth AuthProfile. Omit to run the A2A route unauthenticated
                  (not recommended for production).
                type: object
                required:
                - name
                properties:
                  name:
                    description: Name of the AIGatewayAuthPolicy to share the IdP with.
                    type: string
              agentCard:
                description: |-
                  agentCard configures how the gateway handles agent card discovery requests
                  at GET /.well-known/agent.json.
                type: object
                properties:
                  rewrite:
                    description: |-
                      rewrite, when true, rewrites the url field in the agent card JSON to
                      the gateway URL. Use when the backend's self-reported address is an
                      internal cluster address.
                    type: boolean
                    default: false
                  url:
                    description: |-
                      url is the public gateway URL injected when rewrite is true
                      (e.g. "https://agents.example.com").
                    type: string
              taskAffinity:
                description: |-
                  taskAffinity pins multi-turn A2A task calls to the same backend. On
                  tasks/send the response body's result.id is captured into an Avi VS
                  persistence table. Subsequent calls carrying that task ID in params.id
                  are re-pinned to the backend that created the task.
                type: object
                properties:
                  timeout:
                    description: |-
                      timeout is the idle task affinity lifetime (e.g. "30m", "2h").
                      Defaults to "30m".
                    type: string
                    default: 30m
              agentAccess:
                description: |-
                  agentAccess restricts which calling agents may invoke which A2A methods.
                  The calling agent's identity is resolved from a JWT claim. When omitted,
                  all methods are authorized by OAuth alone.
                type: object
                properties:
                  agentClaim:
                    description: |-
                      agentClaim names the verified JWT claim carrying the calling agent's
                      identity. Defaults to "sub". Use a distinct claim (e.g. "agent_id")
                      to separate human-user and agent tokens from the same IdP.
                    type: string
                    default: sub
                  skillClaim:
                    description: |-
                      skillClaim names the verified JWT claim carrying the agent-card skill
                      the caller is invoking. Defaults to "skill", which is what the issuer's
                      token-exchange endpoint mints. Allow-list entries are matched against
                      this claim as well as against the JSON-RPC method, so a policy can
                      restrict a caller to specific skills rather than whole methods. A
                      legacy token carries no skill, in which case only the method is
                      matched and existing policies behave unchanged.
                    type: string
                    default: skill
                  targetAgent:
                    description: |-
                      This route's own agent name. When set, a caller presenting a token whose
                      `target` claim names a different agent is rejected — audience binding
                      done at the authorization layer, so it needs no change to the shared
                      AIGatewayAuthPolicy audience and no estate-wide cutover. A token with no
                      `target` claim is never rejected, so legacy callers are unaffected.
                    type: string
                  requireMethod:
                    description: |-
                      Reject a request from which no JSON-RPC method could be extracted,
                      instead of letting it through unauthorized. The allow-list can only be
                      evaluated against a method or a skill, so a plain REST call (e.g. GET
                      /healthz) otherwise skips authorization entirely. Defaults to false,
                      because agents on this surface legitimately serve REST alongside A2A;
                      enable it per route on agents that speak only JSON-RPC. The agent-card
                      path is exempted before this check.
                    type: boolean
                    default: false
                  rules:
                    description: |-
                      rules lists, per calling-agent identity, the A2A JSON-RPC methods
                      that agent may invoke. An agent not listed is denied all methods.
                    type: array
                    items:
                      type: object
                      required:
                      - agent
                      - allow
                      properties:
                        agent:
                          description: The agentClaim value this rule applies to (exact match).
                          type: string
                        allow:
                          description: |-
                            A2A JSON-RPC methods (e.g. "tasks/send", "tasks/sendSubscribe")
                            and/or agent-card skills (e.g. "log.collection") this agent may
                            invoke. An entry matches if it equals either the request's method
                            or the caller's skill claim. A single "*" allows everything; a
                            trailing "*" is a prefix glob (e.g. "tasks/*", "log.*").
                          type: array
                          items:
                            type: string
              onUnauthorized:
                description: |-
                  onUnauthorized controls behaviour when a calling agent invokes a method
                  it is not authorized to use.
                type: object
                properties:
                  type:
                    description: |-
                      "Reject" returns a JSON-RPC error with statusCode (default). "Log"
                      tags the request and lets it through for observation before enforcing.
                    type: string
                    default: Reject
                    enum:
                    - Reject
                    - Log
                  statusCode:
                    description: HTTP status returned when type is Reject.
                    type: integer
                    default: 403
                    minimum: 400
                    maximum: 599
          status:
            description: Status reflects the observed state of the policy.
            type: object
            properties:
              conditions:
                type: array
                items:
                  type: object
                  properties:
                    type:
                      type: string
                    status:
                      type: string
                    reason:
                      type: string
                    message:
                      type: string
                    lastTransitionTime:
                      type: string
                      format: date-time
    additionalPrinterColumns:
    - name: Target
      type: string
      jsonPath: .spec.targetRef.name
    - name: Auth
      type: string
      jsonPath: .spec.authRef.name
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
