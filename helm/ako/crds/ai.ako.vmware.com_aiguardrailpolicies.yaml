---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: aiguardrailpolicies.ai.ako.vmware.com
spec:
  group: ai.ako.vmware.com
  names:
    kind: AIGuardrailPolicy
    listKind: AIGuardrailPolicyList
    plural: aiguardrailpolicies
    singular: aiguardrailpolicy
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        description: |-
          AIGuardrailPolicy enforces DLP and content guardrails on AI traffic
          (inference and MCP). AKO authors an Avi WAF policy from this spec — secrets/PII
          DLP plus prompt-injection signatures — and attaches it to the targeted route's
          Virtual Service. Detection runs entirely on the Service Engine WAF (no proxy,
          no sidecar). Semantic detection is out of scope (signatures only).
        type: object
        required:
        - spec
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            required:
            - targetRef
            properties:
              targetRef:
                description: The HTTPRoute (or Gateway) this policy applies to.
                type: object
                required:
                - group
                - kind
                - name
                properties:
                  group:
                    type: string
                  kind:
                    type: string
                    enum:
                    - HTTPRoute
                    - Gateway
                  name:
                    type: string
              profile:
                description: |-
                  Pre-canned guardrail bundle (merged additively with detectors). All
                  carry the DLP core (secrets + PII); they differ in the surface threat:
                  "BlockLLM" adds prompt-injection (LLM prompts); "BlockMCP" adds
                  tool-abuse — command injection / path traversal / SSRF (MCP tool args);
                  "BlockLLMAndMCP" adds both.
                type: string
                enum:
                - BlockLLM
                - BlockMCP
                - BlockLLMAndMCP
              inspect:
                description: Which bodies to scan. Request defaults true, response false.
                type: object
                properties:
                  request:
                    type: boolean
                    default: true
                  response:
                    type: boolean
                    default: false
              detectors:
                description: Explicit detectors, added on top of (or instead of) the profile.
                type: object
                properties:
                  secrets:
                    description: 'Built-in secret signatures: aws-access-key, gcp-api-key, openai-api-key, github-token, slack-token, private-key, jwt.'
                    type: array
                    items:
                      type: string
                  pii:
                    description: 'Built-in PII signatures: ssn, credit-card, email.'
                    type: array
                    items:
                      type: string
                  promptInjection:
                    description: Enable the built-in prompt-injection signature set (LLM).
                    type: boolean
                  toolAbuse:
                    description: Enable the built-in tool-abuse set — command injection / path traversal / SSRF (MCP).
                    type: boolean
                  keywords:
                    description: Literal denylist (classification markers / banned topics).
                    type: object
                    properties:
                      match:
                        type: array
                        items:
                          type: string
                      caseSensitive:
                        type: boolean
                        default: false
                  custom:
                    description: Raw-regex detectors.
                    type: array
                    items:
                      type: object
                      required:
                      - name
                      - regex
                      properties:
                        name:
                          type: string
                        regex:
                          type: string
              action:
                description: What happens on a match.
                type: object
                properties:
                  type:
                    type: string
                    default: Block
                    enum:
                    - Block
                    - Log
                  statusCode:
                    type: integer
                    default: 403
                    minimum: 400
                    maximum: 599
          status:
            type: object
            properties:
              conditions:
                type: array
                items:
                  type: object
                  properties:
                    type:
                      type: string
                    status:
                      type: string
                    reason:
                      type: string
                    message:
                      type: string
                    lastTransitionTime:
                      type: string
                      format: date-time
    additionalPrinterColumns:
    - name: Target
      type: string
      jsonPath: .spec.targetRef.name
    - name: Profile
      type: string
      jsonPath: .spec.profile
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
