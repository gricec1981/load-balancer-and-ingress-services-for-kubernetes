---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: aiguardrailpolicies.ai.ako.vmware.com
spec:
  group: ai.ako.vmware.com
  names:
    kind: AIGuardrailPolicy
    listKind: AIGuardrailPolicyList
    plural: aiguardrailpolicies
    singular: aiguardrailpolicy
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        description: |-
          AIGuardrailPolicy enforces DLP and content guardrails on AI traffic
          (inference and MCP). AKO authors an Avi WAF policy from this spec — secrets/PII
          DLP plus prompt-injection signatures — and attaches it to the targeted route's
          Virtual Service. Detection runs on the Service Engine (no proxy, no sidecar).
          An optional semantic layer (spec.semantic) has the SE call a prompt-injection
          classifier over ICAP to catch novel/paraphrased injection the signatures miss.
        type: object
        required:
        - spec
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            required:
            - targetRef
            properties:
              targetRef:
                description: The HTTPRoute (or Gateway) this policy applies to.
                type: object
                required:
                - group
                - kind
                - name
                properties:
                  group:
                    type: string
                  kind:
                    type: string
                    enum:
                    - HTTPRoute
                    - Gateway
                  name:
                    type: string
              profile:
                description: |-
                  Pre-canned guardrail bundle (merged additively with detectors). All
                  carry the DLP core (secrets + PII); they differ in the surface threat:
                  "BlockLLM" adds prompt-injection (LLM prompts); "BlockMCP" adds
                  tool-abuse — command injection / path traversal / SSRF (MCP tool args);
                  "BlockLLMAndMCP" adds both.
                type: string
                enum:
                - BlockLLM
                - BlockMCP
                - BlockLLMAndMCP
              inspect:
                description: Which bodies to scan. Request defaults true, response false.
                type: object
                properties:
                  request:
                    type: boolean
                    default: true
                  response:
                    type: boolean
                    default: false
              detectors:
                description: Explicit detectors, added on top of (or instead of) the profile.
                type: object
                properties:
                  secrets:
                    description: 'Built-in secret signatures: aws-access-key, gcp-api-key, openai-api-key, github-token, slack-token, private-key, jwt.'
                    type: array
                    items:
                      type: string
                  pii:
                    description: 'Built-in PII signatures: ssn, credit-card, email.'
                    type: array
                    items:
                      type: string
                  promptInjection:
                    description: Enable the built-in prompt-injection signature set (LLM).
                    type: boolean
                  toolAbuse:
                    description: Enable the built-in tool-abuse set — command injection / path traversal / SSRF (MCP).
                    type: boolean
                  keywords:
                    description: Literal denylist (classification markers / banned topics).
                    type: object
                    properties:
                      match:
                        type: array
                        items:
                          type: string
                      caseSensitive:
                        type: boolean
                        default: false
                  custom:
                    description: Raw-regex detectors.
                    type: array
                    items:
                      type: object
                      required:
                      - name
                      - regex
                      properties:
                        name:
                          type: string
                        regex:
                          type: string
              action:
                description: What happens on a match.
                type: object
                properties:
                  type:
                    type: string
                    default: Block
                    enum:
                    - Block
                    - Log
                  statusCode:
                    type: integer
                    default: 403
                    minimum: 400
                    maximum: 599
              semantic:
                description: |-
                  Semantic (ICAP classifier) layer. The Service Engine calls an
                  out-of-band prompt-injection classifier over ICAP REQMOD and
                  enforces its verdict, catching novel/paraphrased injection the
                  signature layer misses. AKO authors both the icapprofile and the
                  HTTP_SECURITY_ACTION_REQUEST_CHECK_ICAP HTTPPolicySet that makes
                  ICAP fire. No proxy in the request path — the classifier is a
                  callable inspection service.
                type: object
                properties:
                  enabled:
                    description: Turn the ICAP classifier layer on for this route.
                    type: boolean
                    default: false
                  classifier:
                    description: The ICAP server (classifier shim) Service. AKO builds the Pool + authors the icapprofile from this.
                    type: object
                    required:
                    - backendRef
                    properties:
                      backendRef:
                        type: object
                        required:
                        - name
                        properties:
                          name:
                            type: string
                          namespace:
                            description: Defaults to the policy namespace.
                            type: string
                          port:
                            type: integer
                            default: 1344
                  threshold:
                    description: Injection-score cutoff the shim enforces (0..1).
                    type: number
                    default: 0.6
                    minimum: 0
                    maximum: 1
                  failOpen:
                    description: ICAP error/timeout behaviour. true (default) allows on failure (availability); false denies (security).
                    type: boolean
                    default: true
                  action:
                    description: Block (default, reject) or Log (shadow mode — classify and log, don't reject).
                    type: string
                    default: Block
                    enum:
                    - Block
                    - Log
          status:
            type: object
            properties:
              conditions:
                type: array
                items:
                  type: object
                  properties:
                    type:
                      type: string
                    status:
                      type: string
                    reason:
                      type: string
                    message:
                      type: string
                    lastTransitionTime:
                      type: string
                      format: date-time
    additionalPrinterColumns:
    - name: Target
      type: string
      jsonPath: .spec.targetRef.name
    - name: Profile
      type: string
      jsonPath: .spec.profile
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
