worker_processes  2;
error_log  /dev/stderr info;

# nginx strips the worker environment by default; export the vars the Lua
# timers read via os.getenv (cache_client store, scan_timer classifier).
env CACHE_BACKEND;
env CLASSIFIER_HOST;
env CLASSIFIER_PORT;

events { worker_connections 1024; }

http {
    # -- shared state --------------------------------------------------
    lua_shared_dict metering  10m;   # token totals + cache/redaction counters
    lua_shared_dict verdicts   1m;   # async guardrail verdicts per request
    lua_shared_dict streamlog  4m;   # accumulated output text per request (for async scan)

    lua_package_path "/etc/nginx/lua/?.lua;;";

    # DNS for cosocket connects (cache store) + name-based proxy_pass.
    # k8s: kube-dns/coredns ClusterIP;  docker-compose: 127.0.0.11.
    resolver ${RESOLVER} valid=30s ipv6=off;

    # seed counters so /metrics exposes them even before any traffic
    init_by_lua_block {
        local m = ngx.shared.metering
        for _, k in ipairs({ "redactions", "cache_hits", "cache_misses", "gpu_ms_saved" }) do
            m:safe_set(k, 0)
        end
    }

    # upstream model server (vLLM or the mock). Override via env at deploy time.
    upstream model_backend {
        server ${MODEL_BACKEND};   # e.g. vllm.default.svc.cluster.local:8000
        keepalive 16;
    }

    server {
        listen 8080;

        # ---- LLM traffic: the instrumented path ----------------------
        location /v1/ {
            proxy_pass http://model_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Accept-Encoding "";   # never let upstream gzip
            proxy_buffering off;                   # CRITICAL: preserve per-chunk delivery
            proxy_read_timeout 300s;

            access_by_lua_file      /etc/nginx/lua/request_guard.lua;
            header_filter_by_lua_file /etc/nginx/lua/header_filter.lua;
            body_filter_by_lua_file /etc/nginx/lua/stream_filter.lua;
            log_by_lua_file         /etc/nginx/lua/metering_flush.lua;
        }

        # ---- internal semantic-cache lookup hop (access phase, sync) --
        # request_guard.lua calls this via ngx.location.capture on a cache
        # hit. The cache STORE side uses a raw cosocket in a timer instead
        # (cache_client.lua) because the capture happens after the body.
        # Hostname is in a variable so it resolves at request time via the
        # resolver above -- no boot-time dependency on cache-service DNS.
        location = /_cache_lookup {
            internal;
            set $cache_backend "${CACHE_BACKEND}";
            proxy_pass http://$cache_backend/lookup;
            proxy_set_header Content-Type application/json;
        }

        # ---- internal classifier hop (request-phase, synchronous) ----
        # Swap the inline pattern check in request_guard.lua for a real
        # semantic classifier by pointing this at your ICAP-era model svc.
        location = /_classify {
            internal;
            set $classifier_backend "${CLASSIFIER_BACKEND}";
            proxy_pass http://$classifier_backend/classify;
            proxy_set_header Content-Type "application/json";
        }

        # ---- metering endpoint (Prometheus-ish text) ------------------
        location = /metrics {
            content_by_lua_file /etc/nginx/lua/metrics.lua;
        }

        location = /healthz { return 200 "ok\n"; }
    }
}
