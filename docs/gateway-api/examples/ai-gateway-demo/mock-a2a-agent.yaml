      - name: security-agent
        image: python:3.11-slim
        command: ["python3", "/scripts/server.py"]
        env:
        - name: AGENT_NAME
          value: "security-agent"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /.well-known/agent.json
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
        volumeMounts:
        - name: scripts
          mountPath: /scripts
      volumes:
      - name: scripts
        configMap:
          name: mock-a2a-agent-script

---
apiVersion: v1
kind: Service
metadata:
  name: security-agent-svc
  namespace: inference
spec:
  selector:
    app: security-agent
  ports:
  - port: 8080
    targetPort: 8080
