---
# ai-gateway-policies.yaml
#
# AKO AI Gateway demo: JWT authentication + per-group token budgets on llm-route.
#
# AKO (Phase 1.5) creates the Avi JWTServerProfile, AuthProfile and SSO Policy
# automatically from the AIGatewayAuthPolicy below — no setup.sh / manual Avi setup.
# You only need the jwt-issuer pod running (jwt-issuer.yaml) so AKO can fetch its JWKS.
#
# Apply:   kubectl apply -f ai-gateway-policies.yaml

# ─── JWT authentication ──────────────────────────────────────────────────────
apiVersion: ai.ako.vmware.com/v1alpha1
kind: AIGatewayAuthPolicy
metadata:
  name: llm-auth
  namespace: inference
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: llm-route

  jwt:
    # In-cluster issuer (ClusterIP). AKO fetches the JWKS from jwksUri and stores
    # the keys in the Avi JWTServerProfile, so no public IP is needed.
    issuer: "http://jwt-issuer.inference.svc.cluster.local:8080"
    jwksUri: "http://jwt-issuer.inference.svc.cluster.local:8080/jwks"
    audiences:
    - llm-api
    identityClaim: sub         # JWT sub -> consumer identity (per-user counter key)
    forwardClaims:
    - group                    # group claim used for per-group budgets
    - tenant
    - model

  identityHeader: x-ai-consumer
  onFailure:
    statusCode: 401
---
# ─── Per-group token budgets ─────────────────────────────────────────────────
apiVersion: ai.ako.vmware.com/v1alpha1
kind: AITokenRateLimitPolicy
metadata:
  name: llm-limits
  namespace: inference
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: llm-route

  # The token DataScript decodes the JWT directly; identitySource.header is the
  # fallback when no JWT is present, and clientIP is the final fallback.
  identitySource:
    header: x-ai-consumer
    fallback: clientIP

  limits:
  # Per-user counter, but the budget ceiling is chosen by the user's group claim.
  - name: hourly-group-budget
    key: consumer          # per-user counter (JWT sub)
    groupHeader: group     # budget ceiling looked up from this JWT claim
    groupBudgets:
      group1: 500          # 5 x 100-token requests / hr
      group2: 1000         # 10 x 100-token requests / hr
    budget: 0              # 0 = reject unknown groups (403); >0 = fallback ceiling
    tokens: total
    window: 1h
    action:
      type: Reject
      statusCode: 429
      retryAfter: true

  # Optional: soft RPS throttle (per-window token bucket).
  # requestRateLimit:
  #   requestsPerSecond: 5
  #   burst: 10
  #   key: clientIP
