---
# ai-gateway-policies.yaml
#
# AKO AI Gateway demo: OAuth/OIDC authentication + per-group token budgets on llm-route.
#
# AKO creates the Avi issuer Pool, AUTH_PROFILE_OAUTH AuthProfile and SSO_TYPE_OAUTH
# Policy automatically from the AIGatewayAuthPolicy below — no manual Avi setup. You
# need the in-cluster OIDC provider running (jwt-issuer.yaml) and the Gateway listener
# must be HTTPS (OAuth/OIDC requires TLS).
#
# Apply:   kubectl apply -f ai-gateway-policies.yaml

# ─── OAuth/OIDC authentication ───────────────────────────────────────────────
apiVersion: ai.ako.vmware.com/v1alpha1
kind: AIGatewayAuthPolicy
metadata:
  name: llm-auth
  namespace: inference
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: llm-route

  jwt:
    # In-cluster OIDC provider. The Avi SE runs the auth-code flow and fetches the
    # JWKS / exchanges the code at runtime through an Avi Pool that AKO builds from
    # this Service's endpoints — so no public IP is needed (Azure CNI pod IPs are
    # VNet-routable). `issuer` must match the token `iss`.
    issuer: "http://jwt-issuer.inference.svc.cluster.local:8080"
    jwksUri: "http://jwt-issuer.inference.svc.cluster.local:8080/jwks"
    audiences:
    - llm-api                  # access-token aud + OAuth client_id
    identityClaim: sub         # sub -> consumer identity (per-user counter key)
    forwardClaims:
    - group                    # group claim used for per-group budgets (read via oauth_get_claim)

  identityHeader: x-ai-consumer
  onFailure:
    statusCode: 401
---
# ─── Per-group token budgets ─────────────────────────────────────────────────
apiVersion: ai.ako.vmware.com/v1alpha1
kind: AITokenRateLimitPolicy
metadata:
  name: llm-limits
  namespace: inference
  # Optional annotations (uncomment to enable):
  #   admin-token-secret -> AKO generates a read-only GET /v1/admin/counters endpoint
  #     (gated by X-Admin-Token) so a dashboard UI can read live per-user usage. The
  #     named Secret in this namespace holds the token under key "token".
  #   counter-epoch -> bump this value to reset every counter to a fresh keyspace
  #     (instant reset; budgets and the limit name are untouched).
  # annotations:
  #   ai.ako.vmware.com/admin-token-secret: ai-admin-token
  #   ai.ako.vmware.com/counter-epoch: "1"
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: llm-route

  # The token DataScript reads the verified claims via oauth_get_claim;
  # identitySource.header is the fallback when no session is present, and clientIP
  # is the final fallback.
  identitySource:
    header: x-ai-consumer
    fallback: clientIP

  limits:
  # Per-user counter, but the budget ceiling is chosen by the user's group claim.
  - name: hourly-group-budget
    key: consumer          # per-user counter (verified sub claim)
    groupHeader: group     # budget ceiling looked up from this verified claim
    groupBudgets:
      group1: 500          # 5 x 100-token requests / hr
      group2: 1000         # 10 x 100-token requests / hr
    budget: 0              # 0 = reject unknown groups (403); >0 = fallback ceiling
    tokens: total
    window: 1h
    action:
      type: Reject
      statusCode: 429
      retryAfter: true

  # Optional: soft RPS throttle (per-window token bucket).
  # requestRateLimit:
  #   requestsPerSecond: 5
  #   burst: 10
  #   key: clientIP
